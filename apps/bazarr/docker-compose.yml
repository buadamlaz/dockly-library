services:
  bazarr:
    image: lscr.io/linuxserver/bazarr:1.6.0
    container_name: bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - /home/bazarr/config:/config
      - /home/radarr/movies:/movies
      - /home/sonarr/tv:/tv
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
