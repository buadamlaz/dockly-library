services:
  database:
    image: lscr.io/linuxserver/mariadb:11.8.8-r0-ls230
    container_name: bookstack-database
    restart: unless-stopped
    volumes:
      - ./db:/config
    environment:
      MYSQL_ROOT_PASSWORD: "##CREATE_PASSWORD##"
      MYSQL_DATABASE: "bookstackapp"
      MYSQL_USER: "bookstack"
      MYSQL_PASSWORD: "##CREATE_PASSWORD##"

  bookstack:
    image: lscr.io/linuxserver/bookstack:26.05.4-ls283
    container_name: bookstack
    restart: unless-stopped
    depends_on:
      - database
    ports:
      - "6875:80"
    volumes:
      - ./config:/config
    environment:
      APP_URL: "http://localhost:6875"
      DB_HOST: "database"
      DB_DATABASE: "bookstackapp"
      DB_USERNAME: "bookstack"
      DB_PASSWORD: "##CREATE_PASSWORD##"
      TZ: "Etc/UTC"
