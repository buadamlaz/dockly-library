#
# Based on Cloudflare's own quick-tunnel example — reference only, NOT
# parsed or used by Dockly's own install pipeline, which reads this app's
# app.yaml `images:`/`command:` instead.
#
services:
  cloudflared:
    image: cloudflare/cloudflared:2026.9.0
    container_name: cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=your-tunnel-token-here
      - TZ=Etc/UTC
    command:
      - tunnel
      - --no-autoupdate
      - run
