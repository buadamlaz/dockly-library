id: utilities.dashy
name:
  en: Dashy
  tr: Dashy
description:
  en: Self-hosted homepage/dashboard — a customizable launcher for links to all your other self-hosted apps and services, with status checks, search, and themes.
  tr: Self-hosted ana sayfa/panel — diğer tüm self-hosted uygulama ve servislerine giden bağlantılar için özelleştirilebilir bir başlatıcı, durum kontrolü, arama ve tema desteğiyle.
category: [Utilities]
tags: [dashboard, homepage, launcher, utilities]
version: "latest"
license: MIT
website: https://dashy.to
repository: https://github.com/Lissy93/dashy
documentation: https://dashy.to/docs
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/dashy/icon.svg
maintainer:
  name: Lissy93
  source: community

architectures: [amd64, arm64]

# IMPORTANT: Dashy's own image bakes in a default conf.yml at
# /app/user-data/conf.yml, but a bind-mounted volume (Dockly's volume
# rule, /DATA/dockly/<slug>/<name>) starts genuinely EMPTY and shadows it
# — Dashy's server.js reads that file synchronously with no fallback, so
# a missing conf.yml crashes the container on boot in a restart loop
# (same class of gotcha already documented for this catalog's php-nginx
# app). After installing: if it's crash-looping, create a conf.yml under
# the "user-data" volume's host folder via the Files page (see
# docker-compose.yml — reachable via "View YAML" on the install screen —
# for a minimal working example), then restart the container.

images:
  - repository: lissy93/dashy
    tag: "latest"

requirements:
  ram_min: 256MB
  ram_recommended: 512MB
  storage_min: 500MB
hardware:
  gpu: { required: false }

web:
  port: 8080
  path: /

security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: []

ports:
  - container: 8080
    protocol: tcp

volumes:
  - container: /app/user-data
    description: Starts EMPTY — MUST contain a conf.yml or Dashy crash-loops (see "View YAML" for a minimal example). Also holds any custom icons/images/stylesheets you add.
    name: user-data

environment:
  - name: NODE_ENV
    description: Do not change — Dashy's own recommended production setting
    secret: false
    default: "production"

compose:
  file: docker-compose.yml

links:
  website: https://dashy.to
  documentation: https://dashy.to/docs
  repository: https://github.com/Lissy93/dashy
