id: utilities.filebrowser
name:
  en: FileBrowser Quantum
  tr: FileBrowser Quantum
description:
  en: Web-based file manager for a folder of your choosing — upload, browse, preview, and edit files from any browser. This is the actively-maintained "Quantum" fork; the original filebrowser/filebrowser project was archived in September 2026.
  tr: Seçtiğin bir klasör için web tabanlı dosya yöneticisi — herhangi bir tarayıcıdan dosya yükle, gözat, önizle, düzenle. Bu, hâlâ aktif geliştirilen "Quantum" fork'u — orijinal filebrowser/filebrowser projesi Eylül 2026'da arşivlendi.
category: [Utilities]
tags: [files, file-manager, utilities]
version: "1.5.6"
license: Apache-2.0
website: https://filebrowserquantum.com
repository: https://github.com/gtsteffaniak/filebrowser
documentation: https://filebrowserquantum.com/en/docs/getting-started/
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/filebrowser/icon.svg
maintainer:
  name: gtsteffaniak
  source: community

architectures: [amd64, arm64]

images:
  - repository: gtstef/filebrowser
    tag: "1.5.6-stable"

requirements:
  ram_min: 256MB
  ram_recommended: 512MB
  storage_min: 200MB
hardware:
  gpu: { required: false }

# Real, partially-fixable gotcha: the image bootstraps a first account
# with username "admin". FILEBROWSER_ADMIN_PASSWORD (below) overrides its
# password — confirmed straight from the app's own Go source
# (backend/common/settings/config.go's loadEnvConfig). The username has
# NO environment-variable override (only a config.yaml `auth.adminUsername`
# field, which Dockly's install has no way to pre-seed into a fresh
# volume) — it stays "admin" regardless.
web:
  port: 80
  path: /

security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: []

ports:
  - container: 80
    protocol: tcp

volumes:
  - container: /srv
    description: The folder you want to browse/manage — change this after install to point at whatever real directory you actually want FileBrowser to serve (defaults here to its own empty data folder, not any existing files)
    name: files
  - container: /home/filebrowser/data
    description: FileBrowser's own database, config, and cache — this is where its account list and settings live
    name: data

environment:
  - name: FILEBROWSER_ADMIN_PASSWORD
    description: "Password for the built-in \"admin\" account — this is the only way FileBrowser lets you set it at first start (the username itself can't be changed the same way, see the note above)"
    secret: true
    default: "Dockly"
  # Real, confirmed gotcha: the image bakes its default config.yaml into
  # BOTH /home/filebrowser/data/config.yaml AND /home/filebrowser/config.yaml
  # ("copy config to two locations for compatibility", per the image's own
  # Dockerfile comment). FILEBROWSER_CONFIG defaults to the FIRST path —
  # which is exactly the path our "data" volume above bind-mounts a host
  # directory onto. A bind mount to an empty host directory does not copy
  # the image's file into it (unlike a named volume), so the baked config
  # disappears and the app FATALs with "config file ... does not exist".
  # Pointing FILEBROWSER_CONFIG at the second, un-mounted baked copy avoids
  # this entirely — safe because config.yaml only holds static server
  # settings (port, root), not accounts/state, which live in the sqlite
  # database under /home/filebrowser/data (still persisted normally).
  - name: FILEBROWSER_CONFIG
    description: "Path to FileBrowser's config file — pinned outside the mounted data volume so it always exists at startup (see note above)"
    default: "/home/filebrowser/config.yaml"

compose:
  file: docker-compose.yml

links:
  website: https://filebrowserquantum.com
  documentation: https://filebrowserquantum.com/en/docs/getting-started/
  repository: https://github.com/gtsteffaniak/filebrowser
