services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:latest
    container_name: forgejo
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - /home/forgejo/data:/data
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      TZ: "Etc/UTC"
