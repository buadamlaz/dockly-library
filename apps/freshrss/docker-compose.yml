services:
  freshrss:
    image: freshrss/freshrss:1.30.0
    container_name: freshrss
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - /home/freshrss/data:/var/www/FreshRSS/data
      - /home/freshrss/extensions:/var/www/FreshRSS/extensions
    environment:
      TZ: "Etc/UTC"
      CRON_MIN: "1,31"
