services:
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - /home/lidarr/config:/config
      - /home/lidarr/music:/music
      - /home/lidarr/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
