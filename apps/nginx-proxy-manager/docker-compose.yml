services:
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    ports:
      - "80:80"
      - "81:81"
      - "443:443"
    volumes:
      - /home/nginx-proxy-manager/data:/data
      - /home/nginx-proxy-manager/letsencrypt:/etc/letsencrypt
