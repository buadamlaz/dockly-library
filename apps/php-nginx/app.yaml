id: development.php-nginx
name:
  en: PHP + Nginx (multi-domain)
  tr: PHP + Nginx (çoklu domain)
description:
  en: Multi-domain PHP web hosting stack — separate Nginx and PHP-FPM containers, with almost every common PHP extension (gd, curl, mysqli, pdo_mysql, zip, intl, opcache, and more) preinstalled. Nginx's config folder is exposed as a volume, so you add one server block per domain (each pointing at its own folder under the shared web root) and host as many sites as you want from one install.
  tr: Çoklu domain PHP web hosting yığını — Nginx ve PHP-FPM için ayrı container'lar, yaygın kullanılan neredeyse tüm PHP eklentileri (gd, curl, mysqli, pdo_mysql, zip, intl, opcache ve daha fazlası) önceden kurulu. Nginx'in config klasörü volume olarak açık — her domain için bir server bloğu ekleyerek (paylaşılan web root altında kendi klasörüne işaret eden), tek kurulumdan istediğin kadar site yayınlayabilirsin.
category: [Development]
tags: [php, nginx, web, hosting, development, webserver, multi-domain, vhost]
version: "8.5-alpine"
license: MIT
website: https://webdevops.io
repository: https://github.com/webdevops/Dockerfile
documentation: https://webdevops.gitbook.io/webdevops-docker-images/docker-images/dockerfiles/php
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/php-nginx/icon.svg
maintainer:
  name: webdevops
  source: community

architectures: [amd64, arm64]

# Two containers, and nginx is now the STANDARD nginx:alpine image (not
# webdevops/nginx) so its /etc/nginx/conf.d is a real editable volume — one
# server{} block per domain, matching a real multi-site setup (Sonarr-style
# indexer-per-tracker: one .conf per domain). php stays on webdevops/php for
# the wide extension set (gd/curl/mysqli/pdo_mysql/zip/intl/opcache/...).
# Both containers mount the SAME /var/www volume (same volume `name: www`
# on both services => same host folder), so a server block's `root
# /var/www/example.com;` resolves to real files in both containers — nginx
# serves static assets directly and proxies *.php to php:9000 (php-fpm,
# reached via the stack's own docker-network DNS alias, same mechanism as
# Immich's DB_HOSTNAME). IMPORTANT: conf.d starts EMPTY on a fresh install
# (Dockly creates plain empty folders, it doesn't seed volume content) — add
# at least one <domain>.conf file there via the Files page before nginx will
# serve anything. See this app's documentation link for an example server
# block.
requirements:
  ram_min: 256MB
  ram_recommended: 512MB
  storage_min: 500MB
hardware:
  gpu: { required: false }

web:
  port: 80
  path: /

security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: []

services:
  - name: php
    image:
      repository: webdevops/php
      tag: "8.5-alpine"
    volumes:
      - container: /var/www
        name: www
        description: Web root — put one folder per domain here (e.g. /var/www/example.com), shared with the nginx container.
    environment:
      - name: PHP_DISPLAY_ERRORS
        description: Show PHP errors in the response (turn on only while developing)
        secret: false
        default: "0"
      - name: PHP_MEMORY_LIMIT
        description: PHP memory_limit
        secret: false
        default: "512M"
      - name: PHP_MAX_EXECUTION_TIME
        description: PHP max_execution_time (seconds)
        secret: false
        default: "300"
      - name: PHP_UPLOAD_MAX_FILESIZE
        description: PHP upload_max_filesize
        secret: false
        default: "50M"
      - name: PHP_POST_MAX_SIZE
        description: PHP post_max_size
        secret: false
        default: "50M"
      - name: PHP_DATE_TIMEZONE
        description: PHP date.timezone, e.g. Etc/UTC
        secret: false
        default: "Etc/UTC"

  - name: nginx
    primary: true
    depends_on: [php]
    image:
      repository: nginx
      tag: "alpine"
    ports:
      - container: 80
        protocol: tcp
    volumes:
      - container: /etc/nginx/conf.d
        name: conf-d
        description: One .conf file per domain (server blocks) goes here — starts empty, see this app's documentation link for an example. proxy_pass/fastcgi_pass to php:9000 for .php files.
      - container: /var/www
        name: www
        description: Web root — same folder as the php container's /var/www, so nginx can serve the same files it hands off to php-fpm.
      - container: /var/log/nginx
        name: log
        description: Nginx access and error logs, one pair per domain if your server blocks set their own log paths.

compose:
  file: docker-compose.yml

links:
  website: https://webdevops.io
  documentation: https://webdevops.gitbook.io/webdevops-docker-images/docker-images/dockerfiles/php
  repository: https://github.com/webdevops/Dockerfile

# Example server block (create as e.g. example.com.conf in the conf.d
# volume via the Files page — copy this once per domain and adjust the
# server_name/root):
#
#   server {
#       listen 80;
#       server_name example.com www.example.com;
#       root /var/www/example.com;
#       index index.php index.html;
#       access_log /var/log/nginx/example.com.access.log;
#       error_log  /var/log/nginx/example.com.error.log;
#
#       location / {
#           try_files $uri $uri/ /index.php?$query_string;
#       }
#
#       location ~ \.php$ {
#           fastcgi_pass php:9000;
#           fastcgi_index index.php;
#           include fastcgi_params;
#           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#       }
#   }
