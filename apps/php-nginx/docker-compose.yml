#
# Reference only — NOT parsed or used by Dockly's own install pipeline,
# which reads this app's app.yaml `services:` list instead.
#
# ./conf.d starts empty — add one <domain>.conf server block per domain you
# want to host (see app.yaml's trailing comment for an example block).
#
services:
  php:
    image: webdevops/php:8.5-alpine
    container_name: php-nginx-php
    restart: unless-stopped
    volumes:
      - ./www:/var/www
    environment:
      PHP_DISPLAY_ERRORS: "0"
      PHP_MEMORY_LIMIT: "512M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_UPLOAD_MAX_FILESIZE: "50M"
      PHP_POST_MAX_SIZE: "50M"
      PHP_DATE_TIMEZONE: "Etc/UTC"

  nginx:
    image: nginx:alpine
    container_name: php-nginx-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - ./www:/var/www
      - ./log:/var/log/nginx
