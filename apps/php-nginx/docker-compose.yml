#
# Reference only — NOT parsed or used by Dockly's own install pipeline,
# which reads this app's app.yaml `services:` list instead.
#
# ================================================================
# MULTI-DOMAIN SETUP
# ================================================================
# ./conf.d starts completely EMPTY after install — Dockly creates plain
# empty folders, it doesn't seed volume content. Before nginx will serve
# anything, add one <domain>.conf file per site under conf.d (via Dockly's
# Files page — right-click > New file) and one matching folder for that
# site's code under www:
#
#   www/
#     example.com/        <- this site's PHP files (index.php, etc.)
#     shop.example.net/   <- a second, completely separate site
#   conf.d/
#     example.com.conf
#     shop.example.net.conf
#   log/
#     (nginx writes access/error logs here, per the paths each .conf sets)
#
# Example conf.d/example.com.conf — copy this once per domain and change
# server_name + root:
#
#   server {
#       listen 80;
#       server_name example.com www.example.com;
#       root /var/www/example.com;
#       index index.php index.html;
#       access_log /var/log/nginx/example.com.access.log;
#       error_log  /var/log/nginx/example.com.error.log;
#
#       location / {
#           try_files $uri $uri/ /index.php?$query_string;
#       }
#
#       location ~ \.php$ {
#           fastcgi_pass php:9000;
#           fastcgi_index index.php;
#           include fastcgi_params;
#           fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
#       }
#   }
#
# nginx auto-reloads config on container restart (not on the fly) — restart
# the nginx container from Dockly after adding/editing a .conf file.
# ================================================================
#
services:
  php:
    image: webdevops/php:8.5-alpine
    container_name: php-nginx-php
    restart: unless-stopped
    volumes:
      - ./www:/var/www
    environment:
      PHP_DISPLAY_ERRORS: "0"
      PHP_MEMORY_LIMIT: "512M"
      PHP_MAX_EXECUTION_TIME: "300"
      PHP_UPLOAD_MAX_FILESIZE: "50M"
      PHP_POST_MAX_SIZE: "50M"
      PHP_DATE_TIMEZONE: "Etc/UTC"

  nginx:
    image: nginx:alpine
    container_name: php-nginx-nginx
    restart: unless-stopped
    depends_on:
      - php
    ports:
      - "8080:80"
    volumes:
      - ./conf.d:/etc/nginx/conf.d
      - ./www:/var/www
      - ./log:/var/log/nginx
