services:
  postgresql:
    image: postgres:18
    container_name: postgresql
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: "##CREATE_PASSWORD##"
      POSTGRES_USER: "postgres"
      POSTGRES_DB: "app"
      TZ: "Etc/UTC"
    volumes:
      - /path/to/postgresql/data:/var/lib/postgresql/data
    ports:
      - 5432:5432
