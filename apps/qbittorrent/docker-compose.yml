services:
  qbittorrent:
    image: ghcr.io/hotio/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - /home/qbittorrent/config:/config
      - /home/downloads:/data
    environment:
      PUID: "1000"
      PGID: "1000"
      UMASK: "002"
      TZ: "Etc/UTC"
      WEBUI_PORTS: "8080/tcp,8080/udp"
