services:
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - /home/radarr/config:/config
      - /home/radarr/movies:/movies
      - /home/radarr/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
