id: downloads.sonarr
name:
  en: Sonarr
  tr: Sonarr
description:
  en: TV series collection manager — tracks your shows, finds new episodes via Prowlarr/Jackett, and sends them to your download client automatically.
  tr: Dizi koleksiyon yöneticisi — dizilerini takip eder, Prowlarr/Jackett üzerinden yeni bölümleri bulur, otomatik olarak indirme istemcine gönderir.
category: [Downloads]
tags: [tv, downloads, automation, arr]
version: "latest"
license: GPL-3.0
website: https://sonarr.tv
repository: https://github.com/Sonarr/Sonarr
documentation: https://wiki.servarr.com/sonarr
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/sonarr/icon.svg
maintainer:
  name: linuxserver
  source: community

architectures: [amd64, arm64, arm/v7]

images:
  - repository: lscr.io/linuxserver/sonarr
    tag: "latest"

requirements:
  ram_min: 256MB
  ram_recommended: 512MB
  storage_min: 500MB
hardware:
  gpu: { required: false }

web:
  port: 8989
  path: /

security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: []

ports:
  - container: 8989
    protocol: tcp

volumes:
  - container: /config
    description: Sonarr database and settings
    name: config
  - container: /tv
    description: Your TV library — where completed episodes get organized to
    name: tv
  - container: /downloads
    description: Shared download client folder (must match the same path used by your download client, e.g. qBittorrent)
    name: downloads

environment:
  - name: PUID
    description: User ID files are written as
    secret: false
    default: "1000"
  - name: PGID
    description: Group ID files are written as
    secret: false
    default: "1000"
  - name: TZ
    description: Timezone, e.g. Etc/UTC
    secret: false
    default: "Etc/UTC"

compose:
  file: docker-compose.yml

links:
  website: https://sonarr.tv
  documentation: https://wiki.servarr.com/sonarr
  repository: https://github.com/Sonarr/Sonarr
