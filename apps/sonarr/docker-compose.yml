services:
  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls324
    container_name: sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - /home/sonarr/config:/config
      - /home/sonarr/tv:/tv
      - /home/sonarr/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Etc/UTC"
