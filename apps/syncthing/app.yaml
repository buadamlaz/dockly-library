id: utilities.syncthing
name:
  en: Syncthing
  tr: Syncthing
description:
  en: Continuous, peer-to-peer file synchronization — keeps folders in sync across your devices directly, with no cloud middleman, end-to-end encrypted.
  tr: Sürekli, eşler-arası (P2P) dosya senkronizasyonu — bulut aracı olmadan, uçtan uca şifrelenmiş şekilde klasörlerini cihazların arasında doğrudan senkron tutar.
category: [Utilities]
tags: [sync, backup, files, p2p, utilities]
version: "2.1.3"
license: MPL-2.0
website: https://syncthing.net
repository: https://github.com/syncthing/syncthing
documentation: https://docs.syncthing.net
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/syncthing/icon.svg
maintainer:
  name: syncthing
  source: official

architectures: [amd64, arm64, arm/v7]

images:
  - repository: syncthing/syncthing
    tag: "2.1.3"

requirements:
  ram_min: 128MB
  ram_recommended: 256MB
  storage_min: 500MB
hardware:
  gpu: { required: false }

# Real gotcha (found by reading the image's own README-Docker.md, not
# guessed): Syncthing's GUI binds to 127.0.0.1 ONLY unless STGUIADDRESS is
# explicitly set — with the image's own default, the web UI would be
# completely unreachable through the published port. STGUIADDRESS below is
# set to 0.0.0.0:8384 specifically to fix this.
web:
  port: 8384
  path: /

security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: []

ports:
  - container: 8384
    protocol: tcp
  - container: 22000
    protocol: tcp
  - container: 22000
    protocol: udp
  - container: 21027
    protocol: udp

volumes:
  - container: /var/syncthing
    description: Configuration, index database, and (by default) synced folders live under here
    name: data

environment:
  - name: PUID
    description: User ID files are written as
    secret: false
    default: "1000"
  - name: PGID
    description: Group ID files are written as
    secret: false
    default: "1000"
  - name: STGUIADDRESS
    description: "Web UI bind address — must stay 0.0.0.0:8384 (not 127.0.0.1) to be reachable through the published port"
    secret: false
    default: "0.0.0.0:8384"

compose:
  file: docker-compose.yml

links:
  website: https://syncthing.net
  documentation: https://docs.syncthing.net
  repository: https://github.com/syncthing/syncthing
