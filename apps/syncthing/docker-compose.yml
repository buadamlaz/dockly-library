services:
  syncthing:
    image: syncthing/syncthing:2.1.3
    container_name: syncthing
    restart: unless-stopped
    environment:
      - PUID=1000
      - PGID=1000
      # Required — without this the GUI only binds to 127.0.0.1 inside the
      # container and is unreachable through the published port.
      - STGUIADDRESS=0.0.0.0:8384
    volumes:
      - /path/to/syncthing/data:/var/syncthing
    ports:
      - 8384:8384
      - 22000:22000/tcp
      - 22000:22000/udp
      - 21027:21027/udp
