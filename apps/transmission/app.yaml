id: downloads.transmission
name:
  en: Transmission
  tr: Transmission
description:
  en: Lightweight, cross-platform BitTorrent client with a web UI, built on the linuxserver.io base image.
  tr: Web arayüzlü, hafif ve çapraz-platform BitTorrent istemcisi — linuxserver.io taban imajı üzerine kurulu.
category: [Downloads]
tags: [torrent, downloads, webui]
version: "4.1.3"
license: MIT
website: https://transmissionbt.com
repository: https://github.com/transmission/transmission
documentation: https://docs.linuxserver.io/images/docker-transmission/
icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/transmission.svg
maintainer:
  name: linuxserver.io
  source: community

architectures: [amd64, arm64]

images:
  - repository: lscr.io/linuxserver/transmission
    tag: "4.1.3"

requirements:
  ram_min: 256MB
  ram_recommended: 512MB
  storage_min: 1GB
hardware:
  gpu: { required: false }

web:
  port: 9091
  path: /

security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: []

ports:
  - container: 9091
    protocol: tcp
  - container: 51413
    protocol: tcp
  - container: 51413
    protocol: udp

volumes:
  - container: /config
    description: Transmission settings and resume data
    name: config
  - container: /downloads
    description: Completed and in-progress downloads
    name: downloads
  - container: /watch
    description: Drop a .torrent file here to add it automatically
    name: watch

environment:
  - name: PUID
    description: User ID files are written as
    secret: false
    default: "1000"
  - name: PGID
    description: Group ID files are written as
    secret: false
    default: "1000"
  - name: TZ
    description: Timezone, e.g. Etc/UTC
    secret: false
    default: "Etc/UTC"
  - name: USER
    description: Web UI username — leave both User and Pass empty to disable Web UI authentication
    secret: false
    default: ""
  - name: PASS
    description: Web UI password — leave both User and Pass empty to disable Web UI authentication
    secret: true
    default: ""
  - name: TRANSMISSION_WEB_HOME
    description: "Optional — alternate web UI theme package path, leave blank for the default"
    secret: false
    default: ""
  - name: PEERPORT
    description: "Optional — fixed peer port, leave blank to use the default (51413)"
    secret: false
    default: ""
  - name: WHITELIST
    description: "Optional — comma-separated list of IPs allowed to access the daemon RPC"
    secret: false
    default: ""
  - name: HOST_WHITELIST
    description: "Optional — comma-separated list of hostnames allowed in the Host header"
    secret: false
    default: ""

compose:
  file: docker-compose.yml

links:
  website: https://transmissionbt.com
  documentation: https://docs.linuxserver.io/images/docker-transmission/
  repository: https://github.com/transmission/transmission
