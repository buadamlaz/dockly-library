id: utilities.uptime-kuma
name:
  en: Uptime Kuma
  tr: Uptime Kuma
description:
  en: Self-hosted uptime monitoring with a clean dashboard — pings your sites/services on a schedule, shows status history, and can notify you (Telegram, Discord, email, and dozens more) when something goes down.
  tr: Self-hosted uptime izleme, sade bir panel ile — site/servislerini belirli aralıklarla kontrol eder, durum geçmişini gösterir, bir şey çöktüğünde seni bilgilendirebilir (Telegram, Discord, e-posta ve daha onlarcası).
category: [Utilities]
tags: [monitoring, uptime, status, utilities]
version: "2.5.4"
license: MIT
website: https://uptime.kuma.pet
repository: https://github.com/louislam/uptime-kuma
documentation: https://github.com/louislam/uptime-kuma/wiki
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/uptimekuma/icon.svg
maintainer:
  name: louislam
  source: community

architectures: [amd64, arm64, arm/v7]

images:
  - repository: louislam/uptime-kuma
    tag: "2.5.4"

requirements:
  ram_min: 128MB
  ram_recommended: 256MB
  storage_min: 200MB
hardware:
  gpu: { required: false }

web:
  port: 3001
  path: /

# Docker socket access is optional in practice (Uptime Kuma works fine
# monitoring plain HTTP(S)/TCP/ping targets without it), but it's what
# powers the "Docker Container" monitor type — reading a container's
# running state directly via the Docker API instead of an HTTP healthcheck.
# Flagged docker_socket so Dockly's install-time RiskCritical warning +
# required acknowledgement still applies (internal/docker/security_analysis.go)
# — a container with docker.sock access is root-equivalent on the host,
# same caveat as Watchtower.
security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: true
  capabilities_added: []

ports:
  - container: 3001
    protocol: tcp

volumes:
  - container: /app/data
    description: Monitor definitions, status history, and settings
    name: data
  - container: /var/run/docker.sock
    description: Docker's own control socket — optional, only needed for the "Docker Container" monitor type (checks a container's running state directly instead of pinging its HTTP endpoint). Read-only is safe and sufficient.
    host_path: /var/run/docker.sock
    read_only: true

compose:
  file: docker-compose.yml

links:
  website: https://uptime.kuma.pet
  documentation: https://github.com/louislam/uptime-kuma/wiki
  repository: https://github.com/louislam/uptime-kuma
