id: networking.wireguard
name:
  en: WireGuard
  tr: WireGuard
description:
  en: Raw WireGuard VPN server — no web UI, peer configs and QR codes are generated as files/logs on first start. For a full web management UI instead, see WireGuard Easy in this catalog.
  tr: Sade WireGuard VPN sunucusu — web arayüzü yok, peer config'leri ve QR kodları ilk başlangıçta dosya/log olarak üretilir. Tam bir web yönetim arayüzü istiyorsan kataloğumuzdaki WireGuard Easy'ye bak.
category: [Networking]
tags: [vpn, wireguard, networking, security]
version: "1.0.20260223"
license: GPL-3.0
website: https://www.wireguard.com
repository: https://github.com/linuxserver/docker-wireguard
documentation: https://docs.linuxserver.io/images/docker-wireguard/
icon: https://cdn.jsdelivr.net/gh/buadamlaz/dockly-library@main/apps/wireguard/icon.svg
maintainer:
  name: linuxserver.io
  source: community

architectures: [amd64, arm64]

images:
  - repository: lscr.io/linuxserver/wireguard
    tag: "1.0.20260223"

requirements:
  ram_min: 64MB
  ram_recommended: 128MB
  storage_min: 200MB
hardware:
  gpu: { required: false }

# No `web:` block — this image has no web UI at all. Peer configs and QR
# codes are written to the config volume and printed in the container logs
# (LOG_CONFS below) — open the Logs tab after first start, or browse to the
# config volume with the File Browser, to get a peer's .conf/.png.
security:
  privileged: false
  host_network: false
  host_pid: false
  host_ipc: false
  docker_socket: false
  capabilities_added: [NET_ADMIN, SYS_MODULE]

sysctls:
  net.ipv4.conf.all.src_valid_mark: "1"

ports:
  - container: 51820
    protocol: udp

volumes:
  - container: /config
    description: Generated peer configs, QR codes, and server keys — this is your actual VPN setup, back it up
    name: config
  - container: /lib/modules
    description: Host's kernel modules — only needed if SYS_MODULE has to load the WireGuard module itself (mainline Linux 5.6+ already has it built in). Read-only.
    host_path: /lib/modules
    read_only: true

environment:
  - name: PUID
    description: User ID files are written as
    secret: false
    default: "1000"
  - name: PGID
    description: Group ID files are written as
    secret: false
    default: "1000"
  - name: TZ
    description: Timezone, e.g. Etc/UTC
    secret: false
    default: "Etc/UTC"
  - name: SERVERURL
    description: "Optional — your server's public domain/IP, used inside generated peer configs so they know where to connect. Leave blank to auto-detect."
    secret: false
    default: ""
  - name: SERVERPORT
    description: "Optional — external port peers connect to, only needed if you're forwarding a different port than 51820 to this container"
    secret: false
    default: "51820"
  - name: PEERS
    description: "Number of peers to generate (e.g. \"3\"), or a comma-separated list of names (e.g. \"phone,laptop,tablet\")"
    secret: false
    default: "1"
  - name: PEERDNS
    description: "DNS server pushed to peers — \"auto\" uses the container's own DNS"
    secret: false
    default: "auto"
  - name: INTERNAL_SUBNET
    description: Internal VPN subnet peers get addresses from
    secret: false
    default: "10.13.13.0"
  - name: ALLOWEDIPS
    description: "IP ranges routed through the VPN for each peer — 0.0.0.0/0 routes ALL of a peer's traffic through this server"
    secret: false
    default: "0.0.0.0/0"
  - name: LOG_CONFS
    description: Print peer configs and QR codes to the container's log output on start
    secret: false
    default: "true"

compose:
  file: docker-compose.yml

links:
  website: https://www.wireguard.com
  documentation: https://docs.linuxserver.io/images/docker-wireguard/
  repository: https://github.com/linuxserver/docker-wireguard
